[package]
name = "claude-admin"
version = "0.1.0"
description = "Analyses local Claude Code usage transcripts"
authors = ["thorsten"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "claude_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
log = "0.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
dirs = "6.0.0"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[profile.release]
# The publish artifact competed against a 224 MB .NET folder; keeping it small
# is a large part of why this project is Rust at all.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
