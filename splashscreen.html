<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ClaudeUsageAnalyzer</title>
    <!--
      Deliberately self-contained: no module script, no bundle, no font file.
      This window exists to be on screen before the app bundle has loaded, so
      anything it has to wait for defeats its purpose. The colours mirror the
      app's own --background / --foreground tokens so the handover to the main
      window has no visible jump.
    -->
    <style>
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --border: oklch(0.922 0 0);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.145 0 0);
          --foreground: oklch(0.985 0 0);
          --muted-foreground: oklch(0.708 0 0);
          --border: oklch(1 0 0 / 12%);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: 0.625rem;
        font-family: system-ui, 'Segoe UI', sans-serif;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }

      /* The same three ascending bars as the app icon. */
      .mark {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
        height: 3.5rem;
      }

      .bar {
        width: 0.75rem;
        background: var(--foreground);
        border-radius: 2px;
        transform-origin: bottom;
        /* Only transform and opacity animate, so this runs on the compositor
           and keeps moving while the main window's bundle is parsing. */
        animation: pulse 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .bar:nth-child(1) {
        height: 1.875rem;
      }
      .bar:nth-child(2) {
        height: 2.75rem;
        animation-delay: 0.15s;
      }
      .bar:nth-child(3) {
        height: 3.5rem;
        animation-delay: 0.3s;
      }

      @keyframes pulse {
        0%,
        75%,
        100% {
          transform: scaleY(0.35);
          opacity: 0.55;
        }
        28% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar {
          animation: none;
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .title {
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .status {
        font-size: 0.75rem;
        color: var(--muted-foreground);
        margin-top: -1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="title">ClaudeUsageAnalyzer</div>
    <div class="status">Loading…</div>
  </body>
</html>
