name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # Windows, because that is the only platform this app targets; a Linux
    # runner would pass on code that cannot build for release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage the runtime DLLs
        # Not in the repository; the bundle config and the test binaries need them.
        run: ./scripts/stage-runtime.ps1

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        # Not the `cargo lint` alias: its separate target directory exists to
        # keep a local clippy run from fighting a local build, and on a cold CI
        # runner it would just compile everything a second time.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        # The scan against the developer's own ~/.claude is marked ignored and
        # stays out of CI, where that history does not exist.
        run: cargo test
