name: Release

# A release is a version nobody has tagged yet. Bump `version` in
# src-tauri/tauri.conf.json and src-tauri/Cargo.toml, add release-notes/v<version>.md,
# and merge to main; this workflow builds the installer and publishes the tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw 'No version in src-tauri/tauri.conf.json' }

          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($cargo -ne $version) { throw "Cargo.toml says $cargo, tauri.conf.json says $version" }

          $release = if ([string]::IsNullOrEmpty((git tag --list "v$version"))) { 'true' } else { 'false' }
          if ($release -eq 'true' -and -not (Test-Path "release-notes/v$version.md")) {
            throw "Missing release-notes/v$version.md"
          }
          if ($release -eq 'false') { Write-Host "v$version is already released, nothing to do." }

          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v5
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.release == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.release == 'true'
        with:
          workspaces: src-tauri

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Stage the runtime DLLs
        if: steps.version.outputs.release == 'true'
        run: ./scripts/stage-runtime.ps1 -Profile release

      - name: Build the installer
        if: steps.version.outputs.release == 'true'
        run: npx tauri build

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Claude Code Insights ${{ steps.version.outputs.version }}
          body_path: release-notes/v${{ steps.version.outputs.version }}.md
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
